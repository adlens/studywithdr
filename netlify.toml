# Netlify: publish entire repo root (no build)
[build]
  publish = "."

# No redirects – serve all files as-is
# (removes any default SPA-style redirect)

[[redirects]]
  from = "/resources"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/resources/admin"
  to = "/resources/admin.html"
  status = 200

[[redirects]]
  from = "/games/memory-match/dist/*"
  to = "/games/memory-match/:splat"
  status = 301

[[redirects]]
  from = "/games/memory-match/"
  to = "/games/memory-match/index.html"
  status = 301
